<!-- Aplica el tema ANTES de pintar para evitar el parpadeo. Sigue el modo del teléfono.
     Hay un botón para cambiarlo en cada pantalla; la elección queda guardada (gym_theme). -->
<script>
(function () {
  var t = localStorage.getItem('gym_theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  var m = document.getElementById('theme-color');
  if (m) m.content = t === 'dark' ? '#0D0F0A' : '#F5F7F0';
})();
</script>
