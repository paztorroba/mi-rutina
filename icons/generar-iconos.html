<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generar íconos · Dale Paz</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:32px auto;padding:0 16px;color:#11150A;background:#F5F7F0}
  h1{font-size:22px;margin:0 0 8px}
  p{line-height:1.5;color:#4F5644}
  .row{display:flex;gap:16px;align-items:flex-end;margin:20px 0;flex-wrap:wrap}
  figure{margin:0;text-align:center;font-size:12px;color:#4F5644}
  canvas{display:block;border:1px solid #DDE2D0;border-radius:12px;margin-bottom:6px}
  button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#C4F135;color:#11150A;font-size:15px;font-weight:500;cursor:pointer}
  label{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px}
  input[type=color]{width:44px;height:32px;border:0;padding:0;background:none}
</style>
</head>
<body>
<h1>Íconos de Dale Paz</h1>
<p>Abrí esta página en tu <b>iPhone o Mac</b>: el emoji 💪 se dibuja con el diseño de Apple. Tocá el botón y guardá los archivos en la carpeta <code>icons/</code> (reemplazan a los actuales).</p>
<label>Color de fondo <input type="color" id="bg" value="#11150A"></label>
<div class="row">
  <figure><canvas id="c180" width="180" height="180"></canvas>apple-touch-icon.png</figure>
  <figure><canvas id="c32" width="32" height="32" style="width:64px;height:64px;image-rendering:pixelated"></canvas>favicon-32.png</figure>
</div>
<button id="dl">Descargar íconos</button>
<script>
function draw(canvas, size, rounded){
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,size,size);
  ctx.fillStyle = document.getElementById('bg').value;
  if (rounded) { const r = size*0.22; ctx.beginPath(); ctx.roundRect(0,0,size,size,r); ctx.fill(); }
  else ctx.fillRect(0,0,size,size);
  ctx.font = Math.round(size*0.64) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText('💪');
  const y = size/2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent)/2;
  ctx.fillText('💪', size/2, y);
}
function render(){ draw(document.getElementById('c180'),180,false); draw(document.getElementById('c32'),32,true); }
document.getElementById('bg').addEventListener('input', render);
function save(canvas, name){ const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=name; a.click(); }
document.getElementById('dl').addEventListener('click', ()=>{
  save(document.getElementById('c180'),'apple-touch-icon.png');
  setTimeout(()=>save(document.getElementById('c32'),'favicon-32.png'),300);
});
render();
</script>
</body>
</html>
